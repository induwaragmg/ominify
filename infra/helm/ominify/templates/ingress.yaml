apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ominify-ingress
  namespace: ominify-prod
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  tls:
    - hosts:
        - {{ .Values.global.domain }}
        - api.{{ .Values.global.domain }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3002
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3003
    - host: api.{{ .Values.global.domain }}
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 5002
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5003
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 5004
          - path: /api/assistant
            pathType: Prefix
            backend:
              service:
                name: assistant-service
                port:
                  number: 8000
