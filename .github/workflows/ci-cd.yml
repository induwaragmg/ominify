name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  path-filter:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'apps/auth-service/**'
              - 'packages/kafka/**'
              - 'packages/types/**'
            product-service:
              - 'apps/product-service/**'
              - 'packages/product-db/**'
              - 'packages/kafka/**'
              - 'packages/types/**'
            order-service:
              - 'apps/order-service/**'
              - 'packages/order-db/**'
              - 'packages/kafka/**'
              - 'packages/types/**'
            payment-service:
              - 'apps/payment-service/**'
              - 'packages/kafka/**'
              - 'packages/types/**'
            email-service:
              - 'apps/email-service/**'
              - 'packages/kafka/**'
              - 'packages/types/**'
            assistant-service:
              - 'apps/assistant-service/**'
            client:
              - 'apps/client/**'
              - 'packages/types/**'
            admin:
              - 'apps/admin/**'
              - 'packages/types/**'

  quality-checks:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Type Checks
        run: pnpm run check-types

  docker-build:
    name: Build & Security Scan
    needs: [path-filter, quality-checks]
    if: ${{ needs.path-filter.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.path-filter.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
