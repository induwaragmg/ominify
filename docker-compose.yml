version: '3.8'

networks:
  ominify-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  kafka_data:
  prometheus_data:
  grafana_data:

services:
  # --- DATABASES & MESSAGE BROKER ---
  postgres:
    image: postgres:16-alpine
    container_name: ominify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ominify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ominify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ominify-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ominify-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: ominify-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    networks:
      - ominify-network

  # --- APPLICATION MICROSERVICES ---
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      KAFKA_BROKER: "kafka:29092"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ominify-network

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: product-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/ominify_db?schema=product"
      KAFKA_BROKER: "kafka:29092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ominify-network

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      MONGODB_URI: "mongodb://root:mongopassword@mongodb:27017/orders?authSource=admin"
      KAFKA_BROKER: "kafka:29092"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ominify-network

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      KAFKA_BROKER: "kafka:29092"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ominify-network

  email-service:
    build:
      context: .
      dockerfile: apps/email-service/Dockerfile
    container_name: email-service
    environment:
      KAFKA_BROKER: "kafka:29092"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ominify-network

  assistant-service:
    build:
      context: .
      dockerfile: apps/assistant-service/Dockerfile
    container_name: assistant-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@postgres:5432/ominify_db"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ominify-network

  # --- FRONTEND APPLICATIONS ---
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: client-app
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
    networks:
      - ominify-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: admin-app
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
    networks:
      - ominify-network

  # --- OBSERVABILITY STACK ---
  prometheus:
    image: prom/prometheus:latest
    container_name: ominify-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ominify-network

  loki:
    image: grafana/loki:latest
    container_name: ominify-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - ominify-network

  promtail:
    image: grafana/promtail:latest
    container_name: ominify-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ominify-network

  grafana:
    image: grafana/grafana:latest
    container_name: ominify-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=adminpassword
    networks:
      - ominify-network
